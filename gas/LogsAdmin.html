<script>
/* ============================== Activity / Login Log viewer ============================== */
var LA_ACTION_COLOR = { edited: '#002d72', exported: '#0f6fa8', created: '#8c756a', access_denied: '#c73a3b' };

function renderLogsView() {
  document.getElementById('main').innerHTML = '<div class="empty">Loading…</div>';
  runServer('listLoginLog', [], function (logins) {
    runServer('listActivityLog', [], function (activity) {
      laRender(logins || [], activity || []);
    });
  });
}

function laRender(logins, activity) {
  var html = '';
  html += '<div class="top-row"><div style="display:flex;align-items:center;gap:10px;"><h1 style="margin:0;">Activity Log</h1>' +
    '<span class="badge" style="background:#fbfced;color:#8c756a;border:1px solid #dee2ec;">Admin Only</span></div></div>';
  html += '<div class="flex-gap" style="align-items:flex-start;">';

  html += '<div class="section flex-1" style="padding:0;overflow:hidden;">';
  html += '<div style="padding:14px 18px;border-bottom:1px solid #f1f1f1;font-size:13.5px;font-weight:700;color:#002d72;">Login History</div>';
  html += '<div style="overflow:auto;max-height:70vh;"><table><thead><tr><th>Date / Time</th><th>User</th><th>Result</th></tr></thead><tbody>';
  if (logins.length === 0) html += '<tr><td colspan="3" class="empty">No login events recorded yet.</td></tr>';
  logins.forEach(function (e) {
    var ok = e.result === 'success';
    html += '<tr><td>' + escapeHtml(new Date(e.at).toLocaleString()) + '</td><td>' + escapeHtml(e.user) + '</td>' +
      '<td><span class="badge" style="background:' + (ok ? 'rgba(65,182,230,0.14)' : 'rgba(241,102,103,0.14)') + ';color:' + (ok ? '#0f6fa8' : '#c73a3b') + ';">' +
      (ok ? 'Success' : 'Failed (unauthorized domain)') + '</span></td></tr>';
  });
  html += '</tbody></table></div></div>';

  html += '<div class="section" style="flex:1.3;padding:0;overflow:hidden;">';
  html += '<div style="padding:14px 18px;border-bottom:1px solid #f1f1f1;font-size:13.5px;font-weight:700;color:#002d72;">Operation History</div>';
  html += '<div style="overflow:auto;max-height:70vh;"><table><thead><tr><th>Date / Time</th><th>User</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody>';
  if (activity.length === 0) html += '<tr><td colspan="5" class="empty">No activity recorded yet.</td></tr>';
  activity.forEach(function (e) {
    html += '<tr><td>' + escapeHtml(new Date(e.at).toLocaleString()) + '</td><td>' + escapeHtml(e.user) + '</td>' +
      '<td><span class="badge" style="background:rgba(0,0,0,0.05);color:' + (LA_ACTION_COLOR[e.action] || '#374151') + ';">' + escapeHtml(e.action) + '</span></td>' +
      '<td>' + escapeHtml(e.target) + '</td><td style="color:#9ca3af;">' + escapeHtml(e.detail || '') + '</td></tr>';
  });
  html += '</tbody></table></div></div>';

  html += '</div>';
  document.getElementById('main').innerHTML = html;
}
</script>
